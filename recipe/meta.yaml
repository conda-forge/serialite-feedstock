{% set name = "serialite" %}
{% set version = "0.6.2" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/serialite-{{ version }}.tar.gz
  sha256: fa566f3df6ced591d1e60afcdf031e04d56331b9aabaab4723f5a8c6eedcbe3b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - uv-build >=0.9,<0.10
    - pip
  run:
    - python >={{ python_min }},<4.0.0
    - returns >=0.20,<0.27
  run_constrained:
    - fastapi >=0.121.0,<0.136.0
    - pydantic >=2.12.0,<3.0.0
    - ordered-set >=4.1.0,<5.0.0
    - numpy >=1.25.0,<3.0.0

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - serialite
  commands:
    - pip check

about:
  home: https://github.com/drhagen/serialite/
  summary: A serialization library for Python
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/drhagen/serialite/

extra:
  recipe-maintainers:
    - drhagen
