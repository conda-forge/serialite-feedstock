{% set name = "serialite" %}
{% set version = "0.6.5" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/serialite-{{ version }}.tar.gz
  sha256: bc34d6453f41e7aaa4f3f6460eea2739273a1da40a38e30890b06e4c5c76cf2c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - uv-build >=0.13,<0.14
    - pip
  run:
    - python >={{ python_min }},<4.0.0
    - returns >=0.20,<0.31
  run_constrained:
    - fastapi >=0.121.0,<0.163.0
    - pydantic >=2.12.0,<3.0.0
    - ordered-set >=4.1.0,<5.0.0
    - numpy >=1.25.0,<3.0.0

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - serialite
  commands:
    - pip check

about:
  home: https://github.com/drhagen/serialite/
  summary: A serialization library for Python
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/drhagen/serialite/

extra:
  recipe-maintainers:
    - drhagen
